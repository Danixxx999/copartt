# Alternativa multiplataforma: docker compose up --build  →  http://localhost:3000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: copart_dev
      POSTGRES_DB: copart
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://postgres:copart_dev@db:5432/copart
      APP_SECRET: change-me-in-your-own-env-file-0123456789abcdef
      DEMO_PASSWORD: Demo2026!
    command: sh -c "node scripts/seed.js && node src/server.js"
    ports: ["3000:3000"]
    volumes: [uploads:/app/storage]
volumes:
  pgdata:
  uploads:
